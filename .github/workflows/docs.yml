name: Documentation

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - Doxyfile
      - tools/build_docs.py
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - README.md
      - docs/**
      - Doxyfile
      - tools/build_docs.py
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Doxygen
        run: |
          curl --fail --location --output "$RUNNER_TEMP/doxygen.tar.gz" \
            https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz
          echo "14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90  $RUNNER_TEMP/doxygen.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/doxygen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/doxygen-1.18.0/bin/doxygen" --version
      - name: Build and validate both languages
        run: python tools/build_docs.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
