<!doctype html>
<html lang="{{language}}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="{{description}}">
  <title>{{browserTitle}}</title>
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/atlasium-favicon.png">
  <link rel="alternate" hreflang="en-US" href="../en-US/{{filename}}">
  <link rel="alternate" hreflang="pt-BR" href="../pt-BR/{{filename}}">
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../assets/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">{{skip}}</a>
  <header class="header">
    <a class="brand" href="index.html" aria-label="Atlasium"><img src="../assets/atlasium-logo.png" alt="Atlasium" width="180" height="60"></a>
    <div class="header-controls">
      <label class="sr-only" for="language">{{languageLabel}}</label>
      <select id="language"><option value="en-US"{{englishSelected}}>English</option><option value="pt-BR"{{portugueseSelected}}>Português (Brasil)</option></select>
      <button id="theme" class="theme-button" type="button" aria-pressed="false" aria-label="{{darkMode}}">
        <svg id="moon-icon" class="header-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.8 13.1A9 9 0 0 1 10.9 3.2a9 9 0 1 0 9.9 9.9Z"/></svg>
        <svg id="sun-icon" class="header-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        <span id="theme-label">{{darkMode}}</span>
      </button>
      <a class="github" href="https://github.com/1mamute/atlasium" aria-label="GitHub">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 19c-4.5 1.5-4.5-2.5-6-3m12 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3-.3 6.2-1.5 6.2-6.9a5.4 5.4 0 0 0-1.5-3.7A5 5 0 0 0 18.7 1S17.5.6 15 2.5a13 13 0 0 0-6 0C6.5.6 5.3 1 5.3 1a5 5 0 0 0-.1 3.9A5.4 5.4 0 0 0 3.7 8.6c0 5.4 3.2 6.6 6.2 6.9a3.4 3.4 0 0 0-.9 2.6V22"/></svg>
        <span>GitHub</span>
      </a>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar"><nav aria-label="{{documentation}}">{{navigation}}</nav></aside>
    <main id="main"><article class="markdown">{{heading}}{{content}}</article></main>
    <aside class="toc"><nav aria-label="{{onPage}}"><p class="nav-label">{{onPage}}</p>{{sections}}</nav></aside>
  </div>
</body>
</html>
